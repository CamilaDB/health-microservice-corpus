services:
  db:
    image: postgres:16-alpine
    container_name: health_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-health}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-health}
      POSTGRES_DB: ${DB_NAME:-health_corpus}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-health} -d ${DB_NAME:-health_corpus}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: health_api
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-health}
      DB_PASSWORD: ${DB_PASSWORD:-health}
      DB_NAME: ${DB_NAME:-health_corpus}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
